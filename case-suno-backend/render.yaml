# Render Blueprint for the CASE SUNO API.
# Render dashboard -> New -> Blueprint -> connect this repository.
# Values marked "sync: false" are asked for once in the dashboard (they are secrets).

databases:
  - name: casesuno-db
    plan: free            # change to a paid plan for production backups
    databaseName: casesuno
    user: casesuno
    region: singapore

services:
  - type: web
    name: casesuno-api
    runtime: python
    region: singapore
    plan: free            # free instances sleep after 15 min idle; use "starter" for always-on
    buildCommand: ./build.sh
    startCommand: gunicorn config.wsgi:application --bind 0.0.0.0:$PORT --workers 2 --timeout 120
    healthCheckPath: /health/
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: DATABASE_URL
        fromDatabase:
          name: casesuno-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: SITE_URL
        value: https://casesuno.in
      - key: ALLOWED_HOSTS
        value: api.casesuno.in,localhost
      - key: CORS_ALLOWED_ORIGINS
        value: https://casesuno.in,https://www.casesuno.in
      - key: CSRF_TRUSTED_ORIGINS
        value: https://casesuno.in,https://www.casesuno.in,https://api.casesuno.in
      # Must be the SAME value as WEBSITE_API_KEY on the website (frontend) server
      - key: WEBSITE_API_KEY
        sync: false
      # First admin login for casesuno.in/admin (also works for /admin/ Django admin)
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: ADMIN_NAME
        value: CASE SUNO Admin
      - key: ADMIN_NOTIFY_EMAILS
        sync: false
      # Razorpay (Dashboard -> Account & Settings -> API Keys / Webhooks)
      - key: RAZORPAY_KEY_ID
        sync: false
      - key: RAZORPAY_KEY_SECRET
        sync: false
      - key: RAZORPAY_WEBHOOK_SECRET
        sync: false
      # E-mail (e.g. Hostinger mailbox: smtp.hostinger.com, port 465 + SSL)
      - key: EMAIL_BACKEND
        value: django.core.mail.backends.smtp.EmailBackend
      - key: EMAIL_HOST
        value: smtp.hostinger.com
      - key: EMAIL_PORT
        value: "465"
      - key: EMAIL_USE_SSL
        value: "True"
      - key: EMAIL_USE_TLS
        value: "False"
      - key: EMAIL_HOST_USER
        sync: false
      - key: EMAIL_HOST_PASSWORD
        sync: false
      - key: DEFAULT_FROM_EMAIL
        value: CASE SUNO <no-reply@casesuno.in>
